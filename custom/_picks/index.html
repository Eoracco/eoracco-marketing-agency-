<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>EORACCO Custom · 选品</title>
<style>
:root{--ink:#111;--ink2:#555;--ink3:#8a8a8a;--line:#e7e5e1;--bg:#f6f4f0;--card:#fff;--acc:#f5b400}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 140px}
h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;margin:0}
.lede{color:var(--ink2);max-width:640px;margin:10px 0 0}
h2{font-size:22px;letter-spacing:-.02em;margin:44px 0 4px}
.sub{color:var(--ink3);font-size:13px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}}
@media(max-width:699px){.img{padding:10px}.body{padding:10px 12px 12px}.zh{font-size:14px}.bl{font-size:12px}.meta{flex-direction:column;gap:2px;font-size:12px}.out{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .2s,box-shadow .2s;position:relative}
.card.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.img{aspect-ratio:1;background:#fff;display:grid;place-items:center;padding:18px;border-bottom:1px solid var(--line)}
.img img{width:100%;height:100%;object-fit:contain}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.code{font-size:11px;color:var(--ink3);letter-spacing:.04em}
.zh{font-weight:650;font-size:16px;line-height:1.3}.en{font-size:12px;color:var(--ink3);margin-top:-4px}
.bl{font-size:13px;color:var(--ink2);line-height:1.5;flex:1}
.meta{display:flex;justify-content:space-between;font-size:13px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.meta b{font-size:15px}
.tick{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;font-size:15px;color:#fff;transition:.2s}
.card.on .tick{background:var(--ink);border-color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:1180px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.count{font-weight:600}.out{flex:1;min-width:200px;font-size:12px;color:var(--ink2);word-break:break-all}
button{font:inherit;border:0;border-radius:999px;padding:10px 18px;background:var(--ink);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.note{margin-top:14px;font-size:12px;color:var(--ink3)}
</style>
</head>
<body>
<div class="wrap">
  <h1>选品：留下你想要的</h1>
  <p class="lede">点卡片就是选中（再点取消）。上面是新找的设计感好物，下面是现有产品里我觉得还能留的。选完点底部「复制我的选择」，把复制的内容发给我就行。</p>
  <p class="note">价格是每件单价区间（数量越多越便宜），起订量和生产时间来自供应商目录；正式报价还会加制版费和运费。图片为供应商样品图。此页面不公开、不收录。</p>
  <h2>新候选</h2><p class="sub">按材质和做工挑的，单价大多在 $20–60</p>
  <div class="grid" id="new"></div>
  <h2>现有产品（可保留）</h2><p class="sub">没选中的会从网站上拿掉</p>
  <div class="grid" id="old"></div>
</div>
<div class="bar"><div class="in">
  <span class="count" id="count">已选 0 个</span>
  <span class="out" id="out"></span>
  <button class="ghost" id="clear" type="button">清空</button>
  <button id="copy" type="button">复制我的选择</button>
</div></div>
<script>
const D = {"new": [{"code": "N-01", "name": "Handmade stoneware canister, acacia lid", "zh": "手工粗陶储物罐（相思木盖）", "img": "https://s3.distributorcentral.com/uploads/4/F/4F87AC6A6B15CB0C5646960247149051.jpg", "lo": 19.58, "hi": 19.58, "min": 8, "days": 10, "blurb": "手工粗陶，泰国手作，相思木盖带密封圈。放咖啡、茶叶或桌面小物都好看，logo 激光刻在木盖上。三种尺寸。"}, {"code": "N-02", "name": "Matte stoneware tea set with acacia", "zh": "哑光粗陶茶具（相思木杯垫）", "img": "https://s3.distributorcentral.com/uploads/4/1/413A680FE013FB5A0860F6647DBA5FE3.jpg", "lo": 80.0, "hi": 96.0, "min": 16, "days": 7, "blurb": "哑光粗陶茶壶（1L）配两只杯和相思木杯垫。高端客户礼，单价高但很有分量。"}, {"code": "N-03", "name": "Malachite optic tumbler, set of 2", "zh": "墨绿竖纹玻璃杯（两只装）", "img": "https://s3.distributorcentral.com/uploads/6/E/6E6D5D6E6F51BCB5B28C9D5B032CFB79.jpg", "lo": 32.78, "hi": 33.98, "min": 16, "days": 7, "blurb": "墨绿竖纹复古玻璃杯两只装，零售礼盒包装，免制版费，激光雕刻。餐厅、咖啡店、房产礼都合适。"}, {"code": "N-04", "name": "Live-edge acacia serving board", "zh": "原木边相思木餐板", "img": "https://s3.distributorcentral.com/uploads/E/A/EAB2CA9E1F4A903B8FAA213FD937B3FA.jpg", "lo": 30.1, "hi": 33.65, "min": 18, "days": 5, "blurb": "原木边相思木餐板，带麻绳，每块纹理不同，厂家终身保修。制版费约 $69。"}, {"code": "N-05", "name": "Organic cotton check throw", "zh": "有机棉格纹盖毯", "img": "https://s3.distributorcentral.com/uploads/5/8/58DD70367B659715CE2880D6C9A277C8.jpg", "lo": 31.68, "hi": 39.92, "min": 24, "days": 10, "blurb": "100% 有机棉格纹流苏盖毯 60\"×70\"，刺绣 logo。比卫衣毯有质感很多。"}, {"code": "N-06", "name": "Matte ceramic candle with lid", "zh": "哑光陶瓷香薰蜡烛（带盖）", "img": "https://s3.distributorcentral.com/uploads/1/2/127129E9BEE196FBB2593B059F0008A3.jpg", "lo": 20.47, "hi": 30.59, "min": 10, "days": 10, "blurb": "哑光陶瓷杯香薰蜡烛带盖，大豆+椰子蜡，檀香香草味，马卡龙色。烧完杯子还能用。"}, {"code": "N-07", "name": "Ceramic pour-over coffee set", "zh": "陶瓷手冲咖啡套装", "img": "https://s3.distributorcentral.com/uploads/2/B/2B9ED2F861A73C749D4A48B3B209B868.jpg", "lo": 14.05, "hi": 21.42, "min": 50, "days": 6, "blurb": "哑光黑陶瓷手冲滴滤杯 + 杯子。办公室、咖啡店客户礼。单价偏低，可以加咖啡豆做成礼盒。"}, {"code": "N-08", "name": "Waxed canvas tote, leather handles", "zh": "蜡布托特包（真皮提手）", "img": "https://s3.distributorcentral.com/uploads/F/8/F8BED823B436C9AD83B6F9725ADF35C0.jpg", "lo": 21.64, "hi": 35.0, "min": 50, "days": 23, "blurb": "蜡布托特包，真皮提手、铆钉加固。每天能背的包，logo 印一色。制版费约 $185，海运，生产约 23 个工作日。"}, {"code": "N-09", "name": "Full-grain leather dopp kit", "zh": "真皮洗漱包", "img": "https://s3.distributorcentral.com/uploads/C/6/C64C399E09DE424B9942306FA3653C14.jpg", "lo": 34.83, "hi": 57.32, "min": 100, "days": 27, "blurb": "全粒面真皮洗漱包，皮色可按 Pantone 定制，印度制造。高端，100 个起，约 27 个工作日。"}, {"code": "N-10", "name": "Full-grain leather gusset pouch", "zh": "真皮收纳小包", "img": "https://s3.distributorcentral.com/uploads/6/8/6824CB833F0BAA88F330F9EB516D464D.jpg", "lo": 28.75, "hi": 42.17, "min": 100, "days": 27, "blurb": "全粒面真皮收纳小包，同系列，可配洗漱包一起做。100 个起。"}, {"code": "N-11", "name": "Travel tea set with infuser", "zh": "便携泡茶套装（带滤茶）", "img": "https://s3.distributorcentral.com/uploads/5/3/53D5ED1F1042E03B1AC7BBF9E90A5827.jpg", "lo": 34.55, "hi": 44.23, "min": 48, "days": 9, "blurb": "带滤茶壶 + 3 只品茗杯 + 茶巾 + 收纳包。和现有旅行茶具类似，二选一。"}], "old": [{"code": "EO-03", "name": "9-piece ceramic matcha set", "zh": "九件套陶瓷抹茶礼盒", "img": "https://s3.distributorcentral.com/uploads/0/F/0FA20829B53822485C2ABD0DAD90350B.jpg", "lo": 30.15, "hi": 40.23, "min": 100, "days": 25, "blurb": "完整的抹茶套装：茶碗和筅架、竹茶筅、茶勺、筛网，装在印刷礼盒里。生产约需 25 个工作日，请提前预订。"}, {"code": "EO-05", "name": "Kiln-glaze tea set", "zh": "窑变釉茶具", "img": "https://s3.distributorcentral.com/uploads/2/5/25446899056FD2153433E22BE1C711B6.jpg", "lo": 7.37, "hi": 14.14, "min": 150, "days": 13, "blurb": "窑变釉色，每只杯子的花纹都不一样，像手工做的茶礼。"}, {"code": "EO-04", "name": "Travel tea set with case", "zh": "便携陶瓷茶具套装", "img": "https://s3.distributorcentral.com/uploads/E/0/E089AE5D61B84A1E64ACE41AC5F8BA83.jpg", "lo": 24.89, "hi": 35.42, "min": 50, "days": 11, "blurb": "带滤网茶壶加 4 只杯子，全部收进一个便携包，办公室或出差都方便。logo 印在收纳包上。"}, {"code": "EO-14", "name": "Candle trio with acacia lids", "zh": "相思木盖香薰蜡烛三件套", "img": "https://s3.distributorcentral.com/uploads/3/1/31D3C03CCD445BC737A1B46B321C9AAE.jpg", "lo": 25, "hi": 30.5, "min": 25, "days": 7, "blurb": "三支玻璃杯蜡烛配相思木盖，礼盒装。客户会在架子上摆好几个月的礼物。"}, {"code": "EO-15", "name": "Frosted candle with cork lid", "zh": "软木盖磨砂香薰蜡烛", "img": "https://s3.distributorcentral.com/uploads/7/6/7691FC2A8D4B7E12B86357968B8B9F68.jpg", "lo": 12.35, "hi": 13.3, "min": 50, "days": 4, "blurb": "6 oz 磨砂玻璃蜡烛，软木盖，贴您设计的全彩标签，配礼盒。美国制造，有多种香味可选。"}, {"code": "EO-16", "name": "Amber jar candle", "zh": "琥珀玻璃罐蜡烛", "img": "https://s3.distributorcentral.com/uploads/B/1/B187081501E8DBD70672A7C939BCDE76.jpg", "lo": 12.88, "hi": 13.85, "min": 50, "days": 4, "blurb": "8 oz 琥珀色玻璃蜡烛，带盖，贴您的全彩标签，有多种香味可选。"}, {"code": "EO-22", "name": "Heavy canvas work apron", "zh": "厚帆布工作围裙", "img": "https://s3.distributorcentral.com/uploads/5/4/5459FD91D8C69ED08D0191DE4045153E.jpg", "lo": 21.03, "hi": 24.73, "min": 25, "days": 10, "blurb": "厚帆布围裙（27\"×29\"），交叉背带带口袋，适合咖啡店、发廊、工作室。"}, {"code": "EO-23", "name": "Washed canvas kitchen apron", "zh": "水洗帆布厨房围裙", "img": "https://s3.distributorcentral.com/uploads/D/E/DE9D1D52043DDE85C96FBAB483B5807E.jpg", "lo": 16.75, "hi": 21.98, "min": 50, "days": 7, "blurb": "柔软的水洗帆布围裙，带口袋，刺绣 logo，适合厨房和柜台。"}, {"code": "EO-24", "name": "Made-in-Italy soft-cover journal", "zh": "意大利制造软封笔记本", "img": "https://s3.distributorcentral.com/uploads/7/3/7378CAFB96D189B8292D6B9F191EB4AB.jpg", "lo": 13.75, "hi": 18.5, "min": 50, "days": 5, "blurb": "意大利制造的软封笔记本，224 页象牙白横线内页，封面压印 logo。"}, {"code": "EO-25", "name": "Art-print hardcover notebook", "zh": "艺术印花精装本", "img": "https://s3.distributorcentral.com/uploads/F/7/F70CE6854643A8A1B402F0C7E7237918.png", "lo": 22.99, "hi": 29.99, "min": 50, "days": 50, "blurb": "素皮封面精装笔记本，封面刺绣您的 logo，环衬可全彩定制。生产约需 50 个工作日。"}, {"code": "EO-13", "name": "15 oz ceramic mug with cork base", "zh": "软木底陶瓷杯 15 oz", "img": "https://s3.distributorcentral.com/uploads/B/8/B865A08849ACAE2089EEBBBFD157E8BA.jpg", "lo": 4.55, "hi": 11.59, "min": 12, "days": 10, "blurb": "15 oz 哑光陶瓷杯，软木底座。起订量低，小团队也能做。"}, {"code": "EO-07", "name": "Glass bulb propagation station", "zh": "玻璃水培花架", "img": "https://s3.distributorcentral.com/uploads/7/6/767AC7B107A4285B6AC48022FB310971.jpg", "lo": 4.38, "hi": 20.4, "min": 45, "days": 8, "blurb": "原木架配耐热玻璃球瓶，用来水培植物插枝。可选 1、2、3 球，页面价格为单球款。"}, {"code": "EO-11", "name": "Ceramic planter with bamboo stand", "zh": "竹托架陶瓷花盆", "img": "https://s3.distributorcentral.com/uploads/E/7/E78FF70335947AEB01BD42C12C70D9C0.jpg", "lo": 15.8, "hi": 17.4, "min": 96, "days": 8, "blurb": "陶瓷花盆配竹托架，盒内附种子包和椰糠营养块。价格含单色印刷。"}, {"code": "EO-20", "name": "Corduroy bucket hat", "zh": "灯芯绒渔夫帽", "img": "https://s3.distributorcentral.com/uploads/6/5/651CCC4964FFF6A8A02E32F16CA1A9EB.jpg", "lo": 3.79, "hi": 8.67, "min": 100, "days": 7, "blurb": "柔软的双面灯芯绒渔夫帽，刺绣 logo，十几种颜色可选。"}, {"code": "EO-21", "name": "Six-panel corduroy cap", "zh": "灯芯绒棒球帽", "img": "https://s3.distributorcentral.com/uploads/F/6/F6296D7928FA0B1A29CB8B9DA0048A2F.png", "lo": 3.31, "hi": 6.05, "min": 20, "days": 5, "blurb": "无衬软顶六片灯芯绒帽，正面刺绣，20 顶起做。"}]};
const KEY='eoracco-picks';let sel=new Set();
try{sel=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
const money=n=>'$'+Number(n).toFixed(2);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function card(p){const pr=p.lo? (p.lo===p.hi?money(p.lo):money(p.lo)+'–'+money(p.hi)) :'询价';
return `<div class="card ${sel.has(p.code)?'on':''}" data-code="${p.code}"><span class="tick">✓</span>
<div class="img"><img src="${p.img}" alt="" loading="lazy"></div>
<div class="body"><span class="code">${p.code}</span><span class="zh">${esc(p.zh)}</span><span class="en">${esc(p.name)}</span>
<span class="bl">${esc(p.blurb)}</span>
<div class="meta"><span><b>${pr}</b></span><span>${p.min} 件起${p.days?' · 约 '+p.days+' 天':''}</span></div></div></div>`}
function render(){document.getElementById('new').innerHTML=D.new.map(card).join('');document.getElementById('old').innerHTML=D.old.map(card).join('');sum()}
function sum(){const all=[...D.new,...D.old].filter(p=>sel.has(p.code));
document.getElementById('count').textContent='已选 '+all.length+' 个';
document.getElementById('out').textContent=all.map(p=>p.code+' '+p.zh).join('、');
try{localStorage.setItem(KEY,JSON.stringify([...sel]))}catch(e){}}
document.addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;const k=c.dataset.code;sel.has(k)?sel.delete(k):sel.add(k);c.classList.toggle('on');sum()});
document.getElementById('clear').onclick=()=>{sel.clear();render()};
document.getElementById('copy').onclick=async()=>{const t='我选的产品：'+document.getElementById('out').textContent;
try{await navigator.clipboard.writeText(t);document.getElementById('copy').textContent='已复制 ✓'}catch(e){document.getElementById('copy').textContent='请手动复制上面的文字'}
setTimeout(()=>document.getElementById('copy').textContent='复制我的选择',2000)};
render();
</script>
</body>
</html>
